<div>
  <div class="text-center mb-8">
    <h1 class="text-3xl font-heading font-extrabold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">
      Your Favorites
    </h1>
    <p class="text-sm opacity-60 mt-1">Reviews you've saved for later</p>
  </div>

  @if (loading()) {
    @for (i of [1, 2, 3]; track i) {
      <div class="card bg-base-200 border border-base-300 mb-4 p-5">
        <div class="flex gap-3 animate-pulse">
          <div class="skeleton w-10 h-10 rounded-full shrink-0"></div>
          <div class="flex-1 space-y-2">
            <div class="skeleton h-3 w-28"></div>
            <div class="skeleton h-16 w-full"></div>
          </div>
        </div>
      </div>
    }
  } @else {
    @for (fav of favorites(); track fav.id) {
      <app-review-card [review]="fav.review" />
    } @empty {
      <div class="text-center py-16">
        <div class="text-6xl mb-4">🔖</div>
        <h2 class="text-xl font-heading font-bold mb-2">No favorites yet</h2>
        <p class="text-sm opacity-60">Start saving reviews you love from the feed!</p>
      </div>
    }
  }
</div>
