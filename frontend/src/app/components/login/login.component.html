<div class="flex justify-center items-center min-h-[60vh] px-4">
  <div class="card bg-base-200 border border-base-300 w-full max-w-md shadow-xl animate-fade-in-up">
    <div class="card-body gap-5">

      <!-- Header -->
      <div class="text-center">
        <div class="text-4xl mb-2">📚</div>
        <h1 class="text-xl font-heading font-bold">Welcome Back</h1>
        <p class="text-sm opacity-60">Sign in to continue to Bookly</p>
      </div>

      <!-- Form -->
      <form (ngSubmit)="onLogin()" class="space-y-4">
        <div class="form-control">
          <label class="label"><span class="label-text">Username</span></label>
          <input type="text"
                 id="login-username"
                 [(ngModel)]="username"
                 name="username"
                 placeholder="Enter your username"
                 class="input input-bordered w-full"
                 required
                 autocomplete="username" />
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text">Password</span></label>
          <input type="password"
                 id="login-password"
                 [(ngModel)]="password"
                 name="password"
                 placeholder="Enter your password"
                 class="input input-bordered w-full"
                 required
                 autocomplete="current-password" />
        </div>

        @if (error()) {
          <div class="alert alert-error text-sm py-2">
            <span>{{ error() }}</span>
          </div>
        }

        <button type="submit" class="btn btn-primary w-full" [disabled]="loading()">
          @if (loading()) {
            <span class="loading loading-spinner loading-sm"></span> Signing in...
          } @else {
            Sign In
          }
        </button>
      </form>

      <p class="text-center text-sm opacity-60">
        Don't have an account?
        <a routerLink="/register" class="link link-primary font-semibold">Create one</a>
      </p>
    </div>
  </div>
</div>
